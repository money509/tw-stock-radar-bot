name: TW Stock Radar Daily Runner

on:
  schedule:
    # 台灣時間平日 08:40 自動啟動 (UTC 00:40)
    - cron: '40 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trading-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run trading script
        env:
          PYTHONUNBUFFERED: "1"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and push position state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add position.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update position state [skip ci]" && git push)
